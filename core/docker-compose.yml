services:
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      target: devx
    hostname: devx
    volumes:
      - devx_workspace:/devx
    ports:
      - "127.0.0.1:${DEVX_SSH_PORT:-2222}:22"
    restart: unless-stopped
    environment:
      - UV_PYTHON_INSTALL_DIR=/opt/python
      # Optional service environment should be merged from additional compose files.

volumes:
  devx_workspace:
