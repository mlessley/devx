services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: example-password  # placeholder: replace with a secure password
      POSTGRES_USER: devx
      POSTGRES_DB: devx
    ports:
      - "${DEVX_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
